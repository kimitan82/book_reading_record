<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>読書記録管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-row">
          <h1>読書記録管理</h1>
          <button id="logout-button" type="button" class="secondary-button hidden">ログアウト</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel auth-panel">
          <h2>ログイン</h2>

          <div class="auth-forms">
            <div class="auth-actions">
              <button id="google-login-button" type="button" class="primary-button">Googleでログイン</button>
            </div>
          </div>

          <p id="auth-status" class="status-message" aria-live="polite"></p>
        </section>

        <section class="panel" data-auth-required>
          <div class="section-header">
            <h2>読書記録</h2>
            <span id="user-name" class="user-badge">未ログイン</span>
          </div>

          <form id="book-form" class="book-form">
            <h2>課題図書を登録</h2>

            <div class="field">
              <label for="book-title">タイトル</label>
              <input id="book-title" name="title" type="text" maxlength="100" placeholder="例: 人間失格" required />
            </div>

            <div class="field">
              <label for="book-author">著者</label>
              <input id="book-author" name="author" type="text" maxlength="100" placeholder="例: 太宰治" />
            </div>

            <button type="submit" class="primary-button">登録する</button>
          </form>

          <p id="status-message" class="status-message" aria-live="polite"></p>
        </section>

        <section class="panel panel-wide" data-auth-required>
          <div class="section-header">
            <h2>読書状況</h2>
            <span id="book-count" class="count-badge">0件</span>
          </div>

          <ul id="book-list" class="book-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
