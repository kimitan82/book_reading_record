<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課題図書管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>課題図書管理</h1>
      </header>

      <main class="layout">
        <section class="panel">
          <div class="auth-box">
            <h2>Firebaseログイン</h2>
            <div class="auth-actions">
              <button id="login-button" type="button" class="primary-button">Googleでログイン</button>
              <button id="logout-button" type="button" class="secondary-button hidden">ログアウト</button>
            </div>
          </div>

          <form id="firebase-config-form" class="config-form">
            <label for="firebase-config-json">Firebase設定JSONを保存</label>
            <textarea
              id="firebase-config-json"
              rows="8"
              placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'
            ></textarea>
            <button type="submit" class="secondary-button">設定を保存</button>
          </form>

          <form id="book-form" class="book-form">
            <h2>課題図書を登録</h2>

            <div class="field">
              <label for="book-title">タイトル</label>
              <input id="book-title" name="title" type="text" maxlength="100" placeholder="例: 人間失格" required />
            </div>

            <div class="field">
              <label for="book-author">著者</label>
              <input id="book-author" name="author" type="text" maxlength="100" placeholder="例: 太宰治" />
            </div>

            <button type="submit" class="primary-button">登録する</button>
          </form>

          <p id="status-message" class="status-message" aria-live="polite"></p>
        </section>

        <section class="panel">
          <div class="section-header">
            <h2>読書状況</h2>
            <span id="book-count" class="count-badge">0件</span>
          </div>

          <ul id="book-list" class="book-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
