<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>読書記録管理</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-row">
          <h1>読書記録管理</h1>
          <button id="logout-button" type="button" class="secondary-button hidden">ログアウト</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel auth-panel">
          <h2>ログイン</h2>

          <div class="auth-forms">
            <form id="signup-form" class="stacked-form">
              <h3>新規登録</h3>
              <div class="field">
                <label for="signup-name">名前</label>
                <input id="signup-name" type="text" maxlength="50" placeholder="例: 山田太郎" required />
              </div>

              <div class="field">
                <label for="signup-email">メールアドレス</label>
                <input id="signup-email" type="email" maxlength="255" placeholder="example@email.com" required />
              </div>

              <div class="field">
                <label for="signup-password">パスワード</label>
                <input id="signup-password" type="password" minlength="6" maxlength="128" placeholder="6文字以上" required />
              </div>

              <button type="submit" class="primary-button">新規登録</button>
            </form>

            <form id="login-form" class="stacked-form">
              <h3>ログイン</h3>
              <div class="field">
                <label for="login-email">メールアドレス</label>
                <input id="login-email" type="email" maxlength="255" autocomplete="username" placeholder="example@email.com" required />
              </div>

              <div class="field">
                <label for="login-password">パスワード</label>
                <input id="login-password" type="password" maxlength="128" autocomplete="current-password" placeholder="パスワード" required />
              </div>

              <button type="submit" class="primary-button">ログイン</button>
              <button id="reset-password-button" type="button" class="secondary-button">パスワードを再設定する</button>
            </form>
          </div>

          <p id="auth-status" class="status-message" aria-live="polite"></p>
        </section>

        <section class="panel" data-auth-required>
          <div class="section-header">
            <h2>読書記録</h2>
            <span id="user-name" class="user-badge">未ログイン</span>
          </div>
          <p id="user-id" class="user-id">Firebase UID: 未ログイン</p>
          <p>課題図書の登録は専用ページから行えます。</p>
          <a class="primary-button page-link" href="register.html">課題図書を登録する</a>
          <p id="status-message" class="status-message" aria-live="polite"></p>
        </section>

        <section class="panel panel-wide" data-auth-required>
          <div class="section-header">
            <h2>読書状況</h2>
            <span id="book-count" class="count-badge">0件</span>
          </div>
          <div class="sort-controls">
            <label for="sort-field">並べ替え</label>
            <select id="sort-field">
              <option value="createdAt">登録順</option>
              <option value="number">番号</option>
              <option value="course">コース</option>
              <option value="title">タイトル</option>
              <option value="series">シリーズ名</option>
              <option value="author">著者</option>
              <option value="publisher">出版社</option>
              <option value="isbn">ISBN</option>
              <option value="read">読書状況</option>
              <option value="readDate">読んだ日</option>
              <option value="comment">コメント</option>
            </select>
            <select id="sort-direction" aria-label="並べ替え順">
              <option value="asc">昇順</option>
              <option value="desc">降順</option>
            </select>
          </div>
          <div class="filter-controls">
            <label for="filter-field">フィルター</label>
            <select id="filter-field">
              <option value="">項目を選択</option>
              <option value="number">番号</option>
              <option value="course">コース</option>
              <option value="title">タイトル</option>
              <option value="series">シリーズ名</option>
              <option value="author">著者</option>
              <option value="publisher">出版社</option>
              <option value="isbn">ISBN</option>
              <option value="read">読書状況</option>
              <option value="readDate">読んだ日</option>
              <option value="comment">コメント</option>
            </select>
            <input id="filter-value" type="search" placeholder="絞り込み条件" disabled />
            <select id="filter-read-value" class="hidden" aria-label="読書状況の絞り込み">
              <option value="">すべて</option>
              <option value="true">読んだ</option>
              <option value="false">未読</option>
            </select>
            <button id="clear-filter-button" type="button" class="secondary-button">クリア</button>
          </div>

          <ul id="book-list" class="book-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script type="module" src="script.js?v=20260905-1"></script>
  </body>
</html>
